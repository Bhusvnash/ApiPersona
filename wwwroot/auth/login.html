<!doctype html>
<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar Sesión - API Personas</title>

  <!-- Relativos CSS -->
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>

<body class="d-flex flex-column justify-content-center align-items-center py-5">

  <main class="container d-flex justify-content-center align-items-center flex-grow-1">
    <div class="card glass-card login-card p-4 p-md-5 rounded-4 fade-in-up">
      <div class="card-body p-0">

        <!-- Header / Logo -->
        <div class="text-center mb-4">
          <div class="login-icon-box">
            <i class="bi bi-shield-lock-fill"></i>
          </div>
          <h2 class="fw-bold text-white mb-1">Bienvenido</h2>
          <p class="text-secondary small">Ingresa tus credenciales </p>
        </div>
        <!-- Contenedor de Alertas -->
        <div id="alertContainer" class="mb-3"></div>

        <!-- Formulario de Login -->
        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="username" class="form-label fw-semibold text-secondary small">NOMBRE DE USUARIO</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person text-secondary"></i></span>
              <input type="text" class="form-control" id="username" placeholder="Tu usuario o correo" required
                autocomplete="username" />
            </div>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center">
              <label for="password" class="form-label fw-semibold text-secondary small">CONTRASEÑA</label>
            </div>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock text-secondary"></i></span>
              <input type="password" class="form-control" id="password" placeholder="••••••••" required
                autocomplete="current-password" />
              <button class="btn btn-outline-secondary border-secondary-subtle px-3" type="button" id="togglePassword"
                title="Mostrar/ocultar contraseña">
                <i class="bi bi-eye text-secondary"></i>
              </button>
            </div>
          </div>

          <button type="submit" id="btnSubmit"
            class="btn btn-primary w-100 py-2.5 fw-semibold d-flex align-items-center justify-content-center gap-2">
            <span>Iniciar Sesión</span>
            <i class="bi bi-arrow-right-short fs-5"></i>
          </button>
        </form>

        <div class="mt-4 pt-3 border-top border-secondary-subtle text-center">
          <small class="text-secondary">¿No tienes cuenta? <a href="../app/index.html"
              class="text-primary text-decoration-none fw-semibold">Ingresar como Invitado</a></small>
        </div>

      </div>
    </div>
  </main>

  <footer class="py-3 text-center text-secondary small opacity-75">
    <div class="container">
    
    </div>
  </footer>

  <!-- Relativos JS -->
  <script src="../assets/Js/bootstrap.bundle.min.js"></script>
  <script src="./login.js" defer></script>
</body>

</html>
