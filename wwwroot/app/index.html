<!doctype html>
<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gestión de Personas - API Personas</title>

  <!-- Rutas Relativas CSS -->
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>

<body class="d-flex flex-column min-vh-100">

  <!-- Header Navbar -->
  <header class="app-header sticky-top py-3 mb-4">
    <div class="container-fluid container-lg d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-3">
        <div class="brand-icon">
          <i class="bi bi-people-fill text-white fs-4"></i>
        </div>
        <div>
          <h1 class="h4 mb-0 fw-bold text-white">Api Personas</h1>
          <small class="text-secondary fs-7">Panel de Administración & Gestor REST</small>
        </div>
      </div>

      <div class="d-flex align-items-center gap-3">
        <div
          class="d-none d-sm-flex align-items-center gap-2 px-3 py-1.5 rounded-pill bg-body-tertiary border border-secondary-subtle">
          <i class="bi bi-person-circle text-primary"></i>
          <span class="small fw-medium" id="currentUserDisplay">Usuario Activo</span>
        </div>
        <a href="../auth/login.html"
          class="btn btn-outline-danger btn-sm px-3 d-flex align-items-center gap-2 rounded-pill" title="Cerrar sesión">
          <i class="bi bi-box-arrow-right"></i>
          <span class="d-none d-md-inline">Salir</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow-1">
    <div class="container-fluid container-lg fade-in-up">

      <!-- Panel de Opciones / Barra de Filtro -->
      <div class="card glass-card mb-4 border-0">
        <div class="card-body p-3 p-md-4">
          <div class="row g-3 align-items-center justify-content-between">
            <div class="col-12 col-md-auto">
              <button id="btnNew"
                class="btn btn-primary px-4 py-2 fw-semibold d-flex align-items-center gap-2 rounded-3">
                <i class="bi bi-plus-lg fs-6"></i>
                <span>Agregar Persona</span>
              </button>
            </div>

            <div class="col-12 col-md-5 col-lg-4">
              <div class="input-group">
                <span class="input-group-text">
                  <i class="bi bi-search text-secondary"></i>
                </span>
                <input type="text" class="form-control" id="inputFilter" placeholder="Buscar por ID o Nombre..." />
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Tabla de Personas -->
      <div class="row justify-content-center">
        <div class="col-12">
          <div class="card glass-card border-0 overflow-hidden">
            <div class="table-responsive">
              <table class="table table-custom align-middle text-center mb-0">
                <thead>
                  <tr>
                    <th scope="col" class="py-3">ID</th>
                    <th scope="col" class="py-3">Nombre</th>
                    <th scope="col" class="py-3">Teléfono</th>
                    <th scope="col" class="py-3 text-center">Acciones</th>
                  </tr>
                </thead>
                <tbody id="tabla">
                  <!-- Renderizado dinámico vía JavaScript -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="py-4 mt-auto border-top border-secondary-subtle bg-body-tertiary text-center text-secondary small">
    <div class="container">
      &copy; 2026 ApiPersonas GUI. Desarrollado con C# REST & Web APIs.
    </div>
  </footer>

  <!-- Modal Modal Reutilizable -->
  <div class="modal fade" id="personModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold text-white d-flex align-items-center gap-2" id="modalTitle">
            <!-- Título dinámico -->
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div id="modalBody" class="modal-body p-4">
          <!-- Formulario dinámico -->
        </div>
        <div id="modalFooter" class="modal-footer p-3">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="btnSave">Guardar cambios</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Rutas Relativas JS -->
  <script src="../assets/Js/bootstrap.bundle.min.js"></script>
  <script src="./js/crud.js" defer></script>
  <script src="./js/doom.js" defer></script>
  <script src="./js/app.js" defer></script>
  <script src="./js/eventos.js" defer></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const loggedUser = localStorage.getItem("userLogged");
      const userDisplay = document.querySelector("#currentUserDisplay");
      if (loggedUser && userDisplay) {
        userDisplay.textContent = loggedUser;
      }
    });
  </script>
</body>

</html>
